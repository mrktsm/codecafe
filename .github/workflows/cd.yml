name: Deploy CodeCafe

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - 'deploy/**'
      - '.github/workflows/cd.yml'
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: Rebuild and restart the CodeCafe backend
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-codecafe
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build production frontend
        working-directory: client
        env:
          VITE_BACKEND_URL: ''
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Determine backend changes
        id: backend
        env:
          EVENT_NAME: ${{ github.event_name }}
          REBUILD: ${{ inputs.deploy_backend }}
          BEFORE: ${{ github.event.before }}
        run: |
          changed=false
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            changed="$REBUILD"
          elif ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=true
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -Eq '^(server/|deploy/compose.yml)'; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Set up deployment SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_HOST_KEY: ${{ vars.VPS_SSH_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          test -n "$VPS_SSH_HOST_KEY"
          printf '%s %s\n' "$VPS_HOST" "$VPS_SSH_HOST_KEY" > ~/.ssh/known_hosts
      - name: Deploy backend when changed
        if: steps.backend.outputs.changed == 'true'
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'mkdir -p ~/codecafe/server ~/codecafe/deploy'
          rsync -az --delete --exclude target server/ "$VPS_USER@$VPS_HOST:~/codecafe/server/"
          scp deploy/compose.yml "$VPS_USER@$VPS_HOST:~/codecafe/deploy/compose.yml"
          ssh "$VPS_USER@$VPS_HOST" 'cd ~/codecafe && docker compose -p codecafe -f deploy/compose.yml build api && docker compose -p codecafe -f deploy/compose.yml up -d --wait --wait-timeout 120'
      - name: Publish frontend
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_dir="codecafe/frontend-releases/$release_id"
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p ~/$remote_dir ~/codecafe/deploy"
          rsync -az client/dist/ "$VPS_USER@$VPS_HOST:~/$remote_dir/"
          scp deploy/Caddyfile "$VPS_USER@$VPS_HOST:~/$remote_dir.Caddyfile.next"
          scp deploy/publish.sh "$VPS_USER@$VPS_HOST:~/codecafe/deploy/publish.sh"
          ssh "$VPS_USER@$VPS_HOST" "sh ~/codecafe/deploy/publish.sh ~/$remote_dir '$release_id' ~/$remote_dir.Caddyfile.next"
      - name: Check frontend and collaboration backend
        run: |
          curl --fail --silent --show-error --retry 3 https://codecafe.app/ | grep -q 'id="root"'
          curl --fail --silent --show-error https://codecafe.app/api/health/redis | grep -q 'Redis connection is OK'
          curl --fail --silent --show-error https://codecafe.app/ws/info | grep -q '"websocket":true'
          curl --fail --silent --show-error https://api.codecafe.app/actuator/health | grep -q '"status":"UP"'
